name: daily-tiers
on:
  schedule:
    - cron: '0 16 * * *'   # 00:00 in the Philippines (UTC+8)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsx scripts/build-tiers.ts
      - run: |
          git config user.name "Ziankyle Piangco"
          git config user.email "ziankyle.mi@gmail.com"
          git add src/data/tiers.json src/data/stats.json
          git diff --cached --quiet || git commit -m "chore: daily tier & stats update"
          git push
